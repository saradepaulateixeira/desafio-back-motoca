services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: concessionaria_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=concessionaria
      - DB_USERNAME=concessionaria
      - DB_PASSWORD=secret
    networks:
      - concessionaria

  nginx:
    image: nginx:alpine
    container_name: concessionaria_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - concessionaria

  postgres:
    image: postgres:16-alpine
    container_name: concessionaria_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=concessionaria
      - POSTGRES_USER=concessionaria
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    networks:
      - concessionaria
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

networks:
  concessionaria:
    driver: bridge

volumes:
  postgres_data:
